<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dealer App – Catalog to Order</title>
    <style>
        :root {
            --bg: #fff;
            --page: #f1f5f9;
            --card: #fff;
            --ink: #111827;
            --mut: #6b7280;
            --line: #e5e7eb;
            --blue: #2563eb;
            --tile: #dbeafe;
            --amber: #fef3c7;
            --amberi: #d97706;
            --green: #16a34a;
            color-scheme: light
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0f172a;
                --page: #0b1220;
                --card: #111c33;
                --ink: #f1f5f9;
                --mut: #94a3b8;
                --line: #243049;
                --tile: #1e3a8a55;
                --amber: #78350f55;
                color-scheme: dark
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--page);
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            display: flex;
            justify-content: center
        }

        #app {
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-top: env(safe-area-inset-top, 0px)
        }

        .top {
            padding: 12px 16px 0
        }

        select {
            width: 100%;
            padding: 12px;
            font: inherit;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--ink);
            box-shadow: 0 2px 6px #0001
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 20px
        }

        h2 {
            font-size: 26px;
            margin: 18px 0 12px
        }

        h3 {
            margin: 0;
            font-size: 17px
        }

        .bar {
            background: var(--page);
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            margin: 12px -16px 0;
            font-size: 19px;
            font-weight: 600
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 2px 8px #0000000a
        }

        .stat {
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between
        }

        .stat small {
            letter-spacing: .08em;
            color: var(--mut);
            font-size: 13px;
            text-transform: uppercase
        }

        .stat div {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .stat b {
            font-size: 40px
        }

        .tile {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--tile);
            display: grid;
            place-items: center;
            color: var(--blue);
            flex: none
        }

        .tile.am {
            background: var(--amber);
            color: var(--amberi)
        }

        .row {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer
        }

        .row .g {
            flex: 1
        }

        .row small {
            color: var(--mut)
        }

        .sw {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            flex: none;
            border: 1px solid var(--line)
        }

        .btn {
            width: 100%;
            border: 0;
            background: var(--blue);
            color: #fff;
            font: 600 17px Georgia, serif;
            padding: 15px;
            border-radius: 16px;
            cursor: pointer
        }

        .btn.o {
            background: none;
            color: var(--blue);
            border: 1px solid var(--blue)
        }

        .back {
            background: none;
            border: 0;
            color: var(--blue);
            font: 16px Georgia, serif;
            padding: 6px 0;
            cursor: pointer
        }

        .chip {
            display: inline-block;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 99px;
            background: var(--tile);
            color: var(--blue)
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .qty button {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font-size: 20px;
            cursor: pointer
        }

        .sp {
            display: flex;
            justify-content: space-between;
            margin: 8px 0
        }

        nav {
            display: flex;
            border-top: 1px solid var(--line);
            background: var(--bg);
            padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px))
        }

        nav button {
            flex: 1;
            background: none;
            border: 0;
            color: var(--mut);
            font: 11px Georgia, serif;
            padding: 6px 0;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            position: relative
        }

        nav button.on {
            background: var(--tile);
            color: var(--blue)
        }

        nav .badge {
            position: absolute;
            top: 0;
            right: 12px;
            background: var(--blue);
            color: #fff;
            border-radius: 99px;
            font-size: 10px;
            min-width: 16px;
            padding: 1px 4px
        }

        svg {
            width: 24px;
            height: 24px;
            fill: currentColor
        }

        .ok {
            text-align: center;
            padding-top: 30px
        }

        .ok .tile {
            width: 84px;
            height: 84px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #dcfce7;
            color: var(--green)
        }

        .hero {
            height: 190px;
            border-radius: 24px;
            border: 1px solid var(--line);
            margin-bottom: 14px
        }

        .sel {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            margin: 4px 6px 4px 0;
            background: var(--card);
            color: var(--ink);
            font: 14px Georgia, serif;
            cursor: pointer
        }

        .sel.on {
            border-color: var(--blue);
            background: var(--tile);
            color: var(--blue)
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="top"><select>
                <option>Dealer A</option>
                <option>Dealer B</option>
            </select></div>
        <main id="v"></main>
        <nav id="nav"></nav>
    </div>
    <script>
        const I = {
            dash: '<path d="M6 2h12v20l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 22zM9 7h6v2H9zm0 4h6v2H9z"/>',
            prod: '<path d="M3 8l9-5 9 5v2H3zm0 4h18v8H3zm7 2v2h4v-2z"/>',
            cat: '<path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/>',
            cart: '<path d="M3 3h3l.6 3H21l-2 9H8.5L6 5H3zm6 15a1.7 1.7 0 110 3.4A1.7 1.7 0 019 18zm8 0a1.7 1.7 0 110 3.4 1.7 1.7 0 010-3.4z"/>',
            ord: '<path d="M6 2h12v20l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 22zM9 7h6v2H9zm0 4h6v2H9z"/>',
            inv: '<path d="M6 2h8l5 5v15H6zm7 1.5V8h4.5zM9 13h7v2H9zm0 4h7v2H9z"/>',
            ok: '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>'
        };
        const ic = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
        const CATS = {
            SPC: { d: 'Stone Plastic Composite – rigid, 100% waterproof click flooring', g: ['#d6b98c', '#b08d57'] },
            LVT: { d: 'Luxury Vinyl Tile – wood & stone looks, glue-down or click', g: ['#c9ced6', '#8b94a3'] },
            'Sheet Vinyl': { d: 'Roll flooring – homogeneous & heterogeneous, for commercial use', g: ['#9fb7c9', '#5f7d95'] }
        };
        const P = [
            { id: 1, c: 'SPC', n: 'Oak Natural 5mm', p: 98, sq: 20, th: '5 mm', w: '0.5 mm wear layer', col: ['#d9bf94', '#b8955f'] },
            { id: 2, c: 'SPC', n: 'Walnut Grey 6mm', p: 112, sq: 18, th: '6 mm', w: '0.7 mm wear layer', col: ['#8d8579', '#5c564e'] },
            { id: 3, c: 'SPC', n: 'Slate Stone 5mm', p: 105, sq: 20, th: '5 mm', w: '0.5 mm wear layer', col: ['#6b7280', '#374151'] },
            { id: 4, c: 'LVT', n: 'Teak Plank 2mm', p: 78, sq: 30, th: '2 mm', w: '0.3 mm wear layer', col: ['#c58f55', '#8a5a2b'] },
            { id: 5, c: 'LVT', n: 'Marble White 3mm', p: 92, sq: 25, th: '3 mm', w: '0.5 mm wear layer', col: ['#f1f1f1', '#c7ccd4'] },
            { id: 6, c: 'LVT', n: 'Ash Wood 2.5mm', p: 84, sq: 28, th: '2.5 mm', w: '0.4 mm wear layer', col: ['#d8d2c4', '#a89f8a'] },
            { id: 7, c: 'Sheet Vinyl', n: 'Hetero Commercial 2mm', p: 64, sq: 'Roll 20 m', th: '2 mm', w: '0.5 mm wear layer', col: ['#7f9db5', '#51728d'] },
            { id: 8, c: 'Sheet Vinyl', n: 'Homogeneous Grey', p: 88, sq: 'Roll 20 m', th: '2 mm', w: 'Through-colour', col: ['#9ca3af', '#6b7280'] },
            { id: 9, c: 'Sheet Vinyl', n: 'Hospital Grade Blue', p: 96, sq: 'Roll 20 m', th: '2 mm', w: 'Antibacterial', col: ['#60a5fa', '#2563eb'] }];
        const g = (c) => `linear-gradient(135deg,${c[0]},${c[1]})`;
        const S = { tab: 'dash', cat: null, prod: null, qty: 1, cart: [], orders: [{ no: 'SO20', d: '12/10/2026', amt: 0, st: 'Pending' }], step: '', last: null };
        const inr = n => '₹' + n.toLocaleString('en-IN');
        const nav = [['dash', 'Dashboard', 'dash'], ['prod', 'Products', 'prod'], ['catalog', 'Catalog', 'cat'], ['cart', 'Cart', 'cart'], ['orders', 'Orders', 'ord'], ['inv', 'Invoices', 'inv']];
        function go(t, x = {}) { S.tab = t; Object.assign(S, { step: '', cat: null, prod: null }, x); render() }
        function render() {
            const n = S.cart.reduce((a, b) => a + b.q, 0);
            document.getElementById('nav').innerHTML = nav.map(([k, l, i]) => `<button class="${S.tab == k ? 'on' : ''}" onclick="go('${k}')">${ic(i)}${l}${k == 'cart' && n ? `<span class=badge>${S.cart.length}</span>` : ''}</button>`).join('');
            const v = document.getElementById('v');
            v.innerHTML = ({ dash, prod: products, catalog, cart, orders, inv: () => `<div class=bar>Invoices</div><p style="color:var(--mut)">0 invoices yet. Invoices appear after dispatch.</p>` }[S.tab])();
            v.scrollTop = 0
        }
        function dash() {
            const pend = S.orders.filter(o => o.st == 'Pending').length;
            const st = (l, n, i, c = '') => `<div class="card stat"><small>${l}</small><div><b>${n}</b><span class="tile ${c}">${ic(i)}</span></div></div>`;
            return `<div class=bar>Dashboard</div><h2>Summary</h2><div class=grid>${st('Total Orders', S.orders.length, 'ord')}${st('Total Invoices', 0, 'inv')}${st('Products in Cart', S.cart.length, 'cat')}${st('Pending Orders', pend, 'prod', 'am')}</div>
 <h2>Outstanding Balance</h2><div class="card row"><span class=tile>${ic('inv')}</span><div class=g><h3>Current Outstanding Balance</h3><small>Amount due from organization</small></div><span>₹0</span></div>
 <h2>Recent Activity</h2>${S.orders.slice().reverse().map(o => `<div class="card row" style="margin-bottom:10px" onclick="go('orders')"><span class=tile>${ic('ord')}</span><div class=g><h3>${o.no} - Dealer A - ${o.d}</h3><small>${o.d}</small></div>›</div>`).join('')}`
        }
        function pcard(p) { return `<div class="card row" style="margin-bottom:12px" onclick="go('catalog',{cat:'${p.c}',prod:${p.id},qty:1})"><div class=sw style="background:${g(p.col)}"></div><div class=g><h3>${p.n}</h3><small>${p.c} · ${p.th}</small><div><b>${inr(p.p)}</b> <small>/ sq ft</small></div></div>›</div>` }
        function products() { return `<div class=bar>Products</div><h2>All Products</h2>${P.map(pcard).join('')}` }
        function catalog() {
            if (S.prod) {
                const p = P.find(x => x.id == S.prod), box = typeof p.sq == 'number';
                return `<button class=back onclick="go('catalog',{cat:'${p.c}'})">‹ ${p.c}</button><div class=hero style="background:${g(p.col)}"></div><span class=chip>${p.c}</span><h2 style="margin-top:8px">${p.n}</h2>
  <div class=card><div class=sp><span>Price</span><b>${inr(p.p)} / sq ft</b></div><div class=sp><span>Thickness</span><span>${p.th}</span></div><div class=sp><span>Wear layer</span><span>${p.w}</span></div><div class=sp><span>Pack</span><span>${box ? p.sq + ' sq ft / box' : p.sq}</span></div></div>
  <div class="sp" style="margin:18px 0"><h3>${box ? 'Boxes' : 'Rolls'}</h3><div class=qty><button onclick="S.qty=Math.max(1,S.qty-1);render()">−</button><b>${S.qty}</b><button onclick="S.qty++;render()">+</button></div></div>
  <button class=btn onclick="add(${p.id})">Add to Cart · ${inr(S.qty * p.p * (box ? p.sq : 20 * 10.76))}</button>`
            }
            if (S.cat) { return `<button class=back onclick="go('catalog')">‹ Catalog</button><h2 style="margin-top:4px">${S.cat}</h2>${P.filter(p => p.c == S.cat).map(pcard).join('')}` }
            return `<div class=bar>Catalog</div><h2>Categories</h2>${Object.entries(CATS).map(([k, c]) => `<div class="card row" style="margin-bottom:12px" onclick="go('catalog',{cat:'${k}'})"><div class=sw style="background:${g(c.g)}"></div><div class=g><h3>${k}</h3><small>${c.d}</small><div><span class=chip>${P.filter(p => p.c == k).length} products</span></div></div>›</div>`).join('')}`
        }
        function add(id) { const l = S.cart.find(x => x.id == id); l ? l.q += S.qty : S.cart.push({ id, q: S.qty }); go('cart') }
        const line = l => { const p = P.find(x => x.id == l.id); return { p, t: l.q * p.p * (typeof p.sq == 'number' ? p.sq : 215.2) } };
        const tot = () => S.cart.reduce((a, l) => a + line(l).t, 0);
        function cart() {
            if (S.step == 'co') return checkout();
            if (S.step == 'done') return done();
            if (!S.cart.length) return `<div class=bar>Cart</div><p style="color:var(--mut)">Your cart is empty.</p><button class=btn onclick="go('catalog')">Browse Catalog</button>`;
            const t = tot();
            return `<div class=bar>Cart</div><h2>Review Cart</h2>${S.cart.map((l, i) => { const { p, t } = line(l); return `<div class="card row" style="margin-bottom:12px"><div class=sw style="background:${g(p.col)}"></div><div class=g><h3>${p.n}</h3><small>${p.c}</small><div class=sp><div class=qty><button onclick="q(${i},-1)">−</button><b>${l.q}</b><button onclick="q(${i},1)">+</button></div><b>${inr(Math.round(t))}</b></div></div></div>` }).join('')}
 <div class=card><div class=sp><span>Subtotal</span><span>${inr(Math.round(t))}</span></div><div class=sp><span>GST 18%</span><span>${inr(Math.round(t * .18))}</span></div><div class=sp><h3>Total</h3><h3>${inr(Math.round(t * 1.18))}</h3></div></div><br>
 <button class=btn onclick="S.step='co';render()">Proceed to Checkout</button><br><br><button class="btn o" onclick="go('catalog')">Continue Shopping</button>`}
        function q(i, d) { S.cart[i].q += d; if (S.cart[i].q < 1) S.cart.splice(i, 1); render() }
        function checkout() {
            const t = Math.round(tot() * 1.18);
            return `<button class=back onclick="S.step='';render()">‹ Cart</button><h2 style="margin-top:4px">Checkout</h2>
 <div class=card><small style="color:var(--mut)">DELIVERY ADDRESS</small><p style="margin:6px 0 0">Dealer A, Andheri East,<br>Mumbai 400093</p></div><br>
 <div class=card><small style="color:var(--mut)">PAYMENT TERMS</small><div style="margin-top:6px"><span class="sel on">Credit (30 days)</span><span class=sel>Advance</span></div></div><br>
 <div class=card><small style="color:var(--mut)">ORDER SUMMARY</small>${S.cart.map(l => `<div class=sp><span>${line(l).p.n} × ${l.q}</span><span>${inr(Math.round(line(l).t))}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><div class=sp><h3>Total (incl. GST)</h3><h3>${inr(t)}</h3></div></div><br>
 <button class=btn onclick="place()">Place Order</button>`}
        function place() { const no = 'SO' + (21 + S.orders.length - 1); S.last = { no, amt: Math.round(tot() * 1.18), n: S.cart.length }; S.orders.push({ no, d: '15/10/2026', amt: S.last.amt, st: 'Pending' }); S.cart = []; S.step = 'done'; render() }
        function done() {
            return `<div class=ok><div class=tile>${ic('ok')}</div><h2 style="margin:0 0 6px">Order Confirmed</h2><p style="color:var(--mut)">Your order has been sent to Responsive Industries.</p>
 <div class=card style="text-align:left;margin:20px 0"><div class=sp><span>Order No.</span><b>${S.last.no}</b></div><div class=sp><span>Items</span><span>${S.last.n}</span></div><div class=sp><span>Total</span><b>${inr(S.last.amt)}</b></div><div class=sp><span>Status</span><span class=chip>Pending</span></div></div>
 <button class=btn onclick="go('orders')">View Orders</button><br><br><button class="btn o" onclick="go('catalog')">Continue Shopping</button></div>`}
        function orders() { return `<div class=bar>Orders</div><h2>My Orders</h2>${S.orders.slice().reverse().map(o => `<div class="card row" style="margin-bottom:12px"><span class=tile>${ic('ord')}</span><div class=g><h3>${o.no}</h3><small>${o.d}</small></div><div style="text-align:right"><b>${o.amt ? inr(o.amt) : '—'}</b><br><span class=chip>${o.st}</span></div></div>`).join('')}` }
        render();
    </script>
</body>

</html>
